<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartLink NFC</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        .profile {
            max-width: 540px;
            min-height: 100vh;
            margin: auto;
            background: white;
            text-align: center;
            padding-bottom: 40px;
            box-shadow: 0 0 30px rgba(0,0,0,.08);
        }

        .cover {
            height: 190px;
            background: linear-gradient(135deg, #111, #333);
            background-size: cover;
            background-position: center;
        }

        .photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #ddd;
            border: 5px solid white;
            margin: -60px auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            overflow: hidden;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .job {
            color: #666;
            font-size: 15px;
        }

        .company {
            font-weight: bold;
            margin-top: 5px;
        }

        .save-btn {
            display: block;
            width: 85%;
            margin: 25px auto 20px;
            padding: 16px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 20px;
        }

        .btn {
            background: #f2f2f2;
            padding: 14px 5px;
            border-radius: 12px;
            text-decoration: none;
            color: #111;
            font-size: 13px;
        }

        .icon {
            display: block;
            font-size: 23px;
            margin-bottom: 5px;
        }

        .section {
            text-align: left;
            padding: 25px 25px 0;
        }

        .section h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .section p {
            color: #555;
            line-height: 1.6;
            white-space: pre-line;
        }

        .social {
            margin-top: 20px;
            padding: 0 20px;
        }

        .social a {
            display: block;
            background: #111;
            color: white;
            text-decoration: none;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .brand {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }

        .loading,
        .error {
            padding: 80px 20px;
        }

        .error {
            color: #c00;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .profile {
                width: 100%;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

<div class="profile">

    <div class="cover" id="cover"></div>

    <div class="photo" id="photo">👤</div>

    <h1 id="name">Loading...</h1>

    <div class="job" id="job">
        SmartLink NFC
    </div>

    <div class="company" id="company"></div>

    <a class="save-btn" id="saveContact" href="#">
        💾 Save Contact
    </a>

    <div class="buttons">

        <a class="btn" id="callBtn" href="#">
            <span class="icon">📞</span>
            Call
        </a>

        <a class="btn" id="whatsappBtn" href="#" target="_blank" rel="noopener">
            <span class="icon">💬</span>
            WhatsApp
        </a>

        <a class="btn" id="emailBtn" href="#">
            <span class="icon">✉️</span>
            Email
        </a>

    </div>

    <div class="section">
        <h2>About</h2>

        <p id="about">
            Welcome to my digital business card.
        </p>
    </div>

    <div class="social">

        <a id="websiteBtn" href="#" target="_blank" rel="noopener" class="hidden">
            🌐 Website
        </a>

        <a id="instagramBtn" href="#" target="_blank" rel="noopener" class="hidden">
            📸 Instagram
        </a>

        <a id="linkedinBtn" href="#" target="_blank" rel="noopener" class="hidden">
            💼 LinkedIn
        </a>

        <a id="facebookBtn" href="#" target="_blank" rel="noopener" class="hidden">
            📘 Facebook
        </a>

    </div>

    <div class="brand">
        Powered by SmartLink NFC
    </div>

</div>

<script>

    // =========================================================
    // SUPABASE CONFIGURATION
    // =========================================================

    const SUPABASE_URL =
        "https://sxnthstllporbicsdbjk.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_Jnbgc4Z3e4p1KvPSAggX0w_m17LC7G_";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // =========================================================
    // GET CLIENT ID FROM URL
    // =========================================================

    const params =
        new URLSearchParams(window.location.search);

    const clientId =
        params.get("id");


    // =========================================================
    // HELPERS
    // =========================================================

    function showError(message) {

        document.getElementById("name").innerText =
            "Profile not found";

        document.getElementById("job").innerText =
            message;

        document.getElementById("company").innerText =
            "";

        document.getElementById("about").innerText =
            "";
    }


    function normalizeUrl(url) {

        if (!url) return "";

        url = String(url).trim();

        if (
            url.startsWith("http://") ||
            url.startsWith("https://") ||
            url.startsWith("mailto:") ||
            url.startsWith("tel:")
        ) {
            return url;
        }

        return "https://" + url;
    }


    // =========================================================
    // LOAD CLIENT
    // =========================================================

    async function loadClient() {

        try {

            if (!clientId) {

                showError(
                    "No profile ID was provided in the link."
                );

                return;
            }


            const { data, error } =
                await supabaseClient
                    .from("Clients")
                    .select("*")
                    .eq("id", clientId)
                    .maybeSingle();


            if (error) {

                console.error(
                    "Supabase error:",
                    error
                );

                showError(
                    "Unable to load this profile. Please try again."
                );

                return;
            }


            if (!data) {

                console.error(
                    "No client found for ID:",
                    clientId
                );

                showError(
                    "This profile does not exist or is not available."
                );

                return;
            }


            displayClient(data);

        } catch (error) {

            console.error(
                "Unexpected error:",
                error
            );

            showError(
                "Something went wrong while loading the profile."
            );
        }
    }


    // =========================================================
    // DISPLAY CLIENT
    // =========================================================

    function displayClient(client) {


        // NAME

        document.getElementById("name").innerText =
            client.name || "SmartLink NFC";


        // COMPANY

        document.getElementById("company").innerText =
            client.company || "";


        // JOB

        document.getElementById("job").innerText =
            client.job || "SmartLink NFC";


        // ABOUT

        document.getElementById("about").innerText =
            client.about ||
            "Welcome to my digital business card. You can contact me directly or save my contact information.";


        // =====================================================
        // PHOTO
        // =====================================================

        if (client.photo) {

            const photo =
                document.getElementById("photo");

            photo.innerHTML = "";

            const img =
                document.createElement("img");

            img.src = client.photo;

            img.alt =
                client.name || "Profile photo";

            img.onerror = function () {

                photo.innerHTML = "👤";
            };

            photo.appendChild(img);
        }


        // =====================================================
        // COVER
        // =====================================================

        if (client.cover) {

            document.getElementById("cover")
                .style.backgroundImage =
                `url("${client.cover}")`;
        }


        // =====================================================
        // PHONE
        // =====================================================

        if (client.phone) {

            document.getElementById("callBtn").href =
                "tel:" + client.phone;

        } else {

            document.getElementById("callBtn")
                .classList.add("hidden");
        }


        // =====================================================
        // WHATSAPP
        // =====================================================

        if (client.whatsapp) {

            let whatsappNumber =
                String(client.whatsapp)
                    .replace(/\D/g, "");


            if (whatsappNumber.startsWith("0")) {

                whatsappNumber =
                    "212" +
                    whatsappNumber.substring(1);
            }


            if (whatsappNumber) {

                document.getElementById("whatsappBtn")
                    .href =
                    "https://wa.me/" +
                    whatsappNumber;

            } else {

                document.getElementById("whatsappBtn")
                    .classList.add("hidden");
            }

        } else {

            document.getElementById("whatsappBtn")
                .classList.add("hidden");
        }


        // =====================================================
        // EMAIL
        // =====================================================

        if (client.email) {

            document.getElementById("emailBtn").href =
                "mailto:" + client.email;

        } else {

            document.getElementById("emailBtn")
                .classList.add("hidden");
        }


        // =====================================================
        // WEBSITE
        // =====================================================

        if (client.website) {

            document.getElementById("websiteBtn")
                .href =
                normalizeUrl(client.website);

            document.getElementById("websiteBtn")
                .classList.remove("hidden");
        }


        // =====================================================
        // INSTAGRAM
        // =====================================================

        if (client.instagram) {

            document.getElementById("instagramBtn")
                .href =
                normalizeUrl(client.instagram);

            document.getElementById("instagramBtn")
                .classList.remove("hidden");
        }


        // =====================================================
        // LINKEDIN
        // =====================================================

        if (client.linkedin) {

            document.getElementById("linkedinBtn")
                .href =
                normalizeUrl(client.linkedin);

            document.getElementById("linkedinBtn")
                .classList.remove("hidden");
        }


        // =====================================================
        // FACEBOOK
        // =====================================================

        if (client.facebook) {

            document.getElementById("facebookBtn")
                .href =
                normalizeUrl(client.facebook);

            document.getElementById("facebookBtn")
                .classList.remove("hidden");
        }


        // =====================================================
        // SAVE CONTACT
        // =====================================================

        setupContactDownload(client);
    }


    // =========================================================
    // CREATE VCARD
    // =========================================================

    function setupContactDownload(client) {

        const name =
            client.name || "";

        const company =
            client.company || "";

        const phone =
            client.phone || "";

        const email =
            client.email || "";


        const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:${escapeVCard(name)}
ORG:${escapeVCard(company)}
TEL;TYPE=CELL:${escapeVCard(phone)}
EMAIL:${escapeVCard(email)}
END:VCARD`;


        const blob =
            new Blob(
                [vcard],
                {
                    type:
                        "text/vcard;charset=utf-8"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const saveButton =
            document.getElementById(
                "saveContact"
            );


        saveButton.href =
            url;


        saveButton.download =
            (name || "SmartLink-NFC") +
            ".vcf";
    }


    // =========================================================
    // ESCAPE VCARD TEXT
    // =========================================================

    function escapeVCard(value) {

        return String(value)
            .replace(/\\/g, "\\\\")
            .replace(/\n/g, "\\n")
            .replace(/,/g, "\\,")
            .replace(/;/g, "\\;");
    }


    // =========================================================
    // START
    // =========================================================

    loadClient();

</script>

</body>
</html>
