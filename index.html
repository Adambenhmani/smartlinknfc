<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLink NFC</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        .profile {
            max-width: 430px;
            min-height: 100vh;
            margin: auto;
            background: white;
            text-align: center;
            padding-bottom: 40px;
        }

        .cover {
            height: 150px;
            background: linear-gradient(135deg, #111, #333);
        }

        .photo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #ddd;
            border: 5px solid white;
            margin: -55px auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .job {
            color: #666;
            font-size: 15px;
        }

        .company {
            font-weight: bold;
            margin-top: 5px;
        }

        .save-btn {
            display: block;
            width: 85%;
            margin: 25px auto 20px;
            padding: 16px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 20px;
        }

        .btn {
            background: #f2f2f2;
            padding: 14px 5px;
            border-radius: 12px;
            text-decoration: none;
            color: #111;
            font-size: 13px;
        }

        .icon {
            display: block;
            font-size: 23px;
            margin-bottom: 5px;
        }

        .section {
            text-align: left;
            padding: 25px 25px 0;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .section p {
            color: #555;
            line-height: 1.6;
        }

        .social {
            margin-top: 20px;
            padding: 0 20px;
        }

        .social a {
            display: block;
            background: #111;
            color: white;
            text-decoration: none;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .brand {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

<div class="profile">

    <div class="cover"></div>

    <div class="photo">
        👤
    </div>

    <h1>Mohamed Alaoui</h1>

    <div class="job">
        CEO & Founder
    </div>

    <div class="company">
        ABC Maroc
    </div>

    <!-- SAVE CONTACT -->
    <a class="save-btn" href="data:text/vcard;charset=utf-8,BEGIN:VCARD%0AVERSION:3.0%0AFN:Mohamed%20Alaoui%0AORG:ABC%20Maroc%0ATEL;TYPE=CELL:+212600000000%0AEMAIL:mohamed@example.com%0AEND:VCARD" download="Mohamed-Alaoui.vcf">
        💾 Save Contact
    </a>

    <div class="buttons">

        <a class="btn" href="tel:+212600000000">
            <span class="icon">📞</span>
            Call
        </a>

        <a class="btn" href="https://wa.me/212600000000">
            <span class="icon">💬</span>
            WhatsApp
        </a>

        <a class="btn" href="mailto:mohamed@example.com">
            <span class="icon">✉️</span>
            Email
        </a>

    </div>

    <div class="section">

        <h2>About</h2>

        <p>
            Welcome to my digital business card.
            You can contact me directly or save my contact
            information to your phone.
        </p>

    </div>

    <div class="social">

        <a href="https://instagram.com/" target="_blank">
            Instagram
        </a>

        <a href="https://linkedin.com/" target="_blank">
            LinkedIn
        </a>

        <a href="https://facebook.com/" target="_blank">
            Facebook
        </a>

    </div>

    <div class="brand">
        Powered by SmartLink NFC
    </div>

</div>

</body>
</html>
