/* =====================================================
   GET CLIENT ID
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


// Supports both the old ?id=UUID links and the new /slug links.
const clientId =
    params.get("id");

const pathParts =
    window.location.pathname
        .split("/")
        .filter(Boolean);

// Supports:
// /smartlinknfc/samir
// /smartlinknfc/index.html/samir
const slugFromPath =
    pathParts.length >= 2 &&
    pathParts[0].toLowerCase() === "smartlinknfc"
        ? (
            pathParts[1].toLowerCase() === "index.html" ||
            pathParts[1].toLowerCase() === "admin.html"
                ? (pathParts[2] ? decodeURIComponent(pathParts[2]) : null)
                : decodeURIComponent(pathParts[1])
          )
        : null;


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(){

    loading.classList.add("hidden");

    profileContent.classList.add("hidden");

    errorBox.classList.remove("hidden");

}


/* =====================================================
   NORMALIZE PHONE
===================================================== */

function cleanPhone(phone){

    if(!phone){
        return "";
    }

    return String(phone)
        .replace(/[^\d+]/g,"");

}


/* =====================================================
   WHATSAPP PHONE
===================================================== */

function whatsappPhone(phone){

    if(!phone){
        return "";
    }

    let value =
        String(phone)
        .replace(/\D/g,"");


    if(value.startsWith("0")){

        value =
            "212" +
            value.substring(1);

    }


    if(!value.startsWith("212") &&
       value.length <= 10){

        value =
            "212" +
            value;

    }


    return value;

}


/* =====================================================
   URL HELPER
===================================================== */

function validUrl(url){

    if(!url){
        return "";
    }

    let value =
        String(url).trim();


    if(
        !value.startsWith("http://") &&
        !value.startsWith("https://")
    ){

        value =
            "https://" +
            value;

    }


    return value;

}


/* =====================================================
   LOAD PROFILE
===================================================== */


function escapeVCard(value){
    return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/\r?\n/g, "\\n")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,");
}


function applyProfileTheme(color){

    const safeColor =
        /^#[0-9a-fA-F]{6}$/.test(
            String(color || "")
        )
            ? String(color)
            : "#111111";

    document.documentElement.style
        .setProperty(
            "--profile-color",
            safeColor
        );

    document.documentElement.style
        .setProperty(
            "--profile-color-soft",
            hexToRgba(safeColor, 0.10)
        );

    // Apply the chosen color to the visible profile UI.
    document
        .querySelectorAll(
            ".save-contact-button, #saveContact, .theme-primary"
        )
        .forEach(function(el){

            el.style.setProperty(
                "background-color",
                safeColor,
                "important"
            );

            el.style.setProperty(
                "border-color",
                safeColor,
                "important"
            );

        });

    document
        .querySelectorAll(
            "h1, h2, .theme-accent"
        )
        .forEach(function(el){

            el.style.setProperty(
                "color",
                safeColor,
                "important"
            );

        });

    document
        .querySelectorAll(
            ".link a, .social-link"
        )
        .forEach(function(el){

            el.style.setProperty(
                "border-color",
                hexToRgba(safeColor, 0.22),
                "important"
            );

        });
}

function hexToRgba(hex, alpha){

    const clean =
        String(hex)
            .replace("#","");

    if(clean.length !== 6){
        return "rgba(17,17,17," + alpha + ")";
    }

    const r =
        parseInt(clean.substring(0,2),16);

    const g =
        parseInt(clean.substring(2,4),16);

    const b =
        parseInt(clean.substring(4,6),16);

    return (
        "rgba(" +
        r + "," +
        g + "," +
        b + "," +
        alpha +
        ")"
    );
}


async function loadProfile(){

    if(!clientId && !slugFromPath){

        showError();

        return;
    }


    console.log(
        "Loading client:",
        clientId
    );


    let data = null;
    let error = null;

    if (slugFromPath) {
        const result =
            await supabaseClient
                .from("Clients")
                .select("*")
                .eq("slug", slugFromPath)
                .maybeSingle();

        data = result.data;
        error = result.error;
    } else if (clientId) {
        const result =
            await supabaseClient
                .from("Clients")
                .select("*")
                .eq("id", clientId)
                .maybeSingle();

        data = result.data;
        error = result.error;
    }


    console.log(
        "Supabase result:",
        data,
        error
    );


    if(error){

        console.error(
            "Supabase error:",
            error
        );

        showError();

        return;
    }


    if(!data){

        console.error(
            "No client found for ID:",
            clientId
        );

        showError();

        return;
    }


    renderProfile(data);

}


/* =====================================================
   RENDER PROFILE
===================================================== */

function renderProfile(client){

    console.log(
        "Client loaded:",
        client
    );


    /* NAME */

    nameElement.textContent =
        client.name ||
        "SmartLink NFC";


    /* JOB */

    if(client.job){

        jobElement.textContent =
            client.job;

        jobElement.style.display =
            "block";

    }else{

        jobElement.style.display =
            "none";

    }


    /* COMPANY */

    if(client.company){

        companyElement.textContent =
            client.company;

        companyElement.style.display =
            "block";

    }else{

        companyElement.style.display =
            "none";

    }


    /* PROFILE PHOTO */

    if(client.photo){

        profilePhoto.src =
            client.photo;

        profilePhoto.style.display =
            "block";

        defaultAvatar.style.display =
            "none";

    }else{

        profilePhoto.style.display =
            "none";

        defaultAvatar.style.display =
            "block";

    }


    /* COVER PHOTO */

    if(client.cover){

        cover.style.backgroundImage =
            "url('" +
            client.cover +
            "')";

    }else{

        cover.style.backgroundImage =
            "linear-gradient(135deg,#111,#292929)";

    }


    /* PHONE 1 / 2 / 3 */
    setupPhoneAction("callButton", client.phone, "Call 1");
    setupPhoneAction("callButton2", client.phone2, "Call 2");
    setupPhoneAction("callButton3", client.phone3, "Call 3");

    /* GOOGLE MAPS 1 / 2 / 3 */

    setupMapsAction("mapsButton2", "mapsText2", client.maps_link2, client.maps_label2 || "Magasin 2");
    setupMapsAction("mapsButton3", "mapsText3", client.maps_link3, client.maps_label3 || "Magasin 3");

    /* EMAIL 1 / 2 / 3 */

    setupEmailAction("emailButton2", client.email2, "Email 2");
    setupEmailAction("emailButton3", client.email3, "Email 3");

    /* ABOUT */

    /* WHATSAPP 1 / 2 / 3 */

    setupWhatsAppLink("whatsappLink2", client.whatsapp2 || null);
    setupWhatsAppLink("whatsappLink3", client.whatsapp3 || null);

    /* WEBSITE */

    setupLink(
        "websiteLink",
        client.website
    );


    /* INSTAGRAM */

    setupLink(
        "instagramLink",
        client.instagram
    );


    /* FACEBOOK */

    setupLink(
        "facebookLink",
        client.facebook
    );


    /* LINKEDIN */

    setupLink(
        "linkedinLink",
        client.linkedin
    );


    /* HIDE EMPTY LINK SECTION */

    const visibleLinks =
        document.querySelectorAll(
            "#linksSection .link:not(.hidden)"
        );


    if(visibleLinks.length === 0){

        linksSection.style.display =
            "none";

    }else{

        linksSection.style.display =
            "block";

    }



    /* PHOTOS */
    let photos = [];

    if(Array.isArray(client.photos)){
        photos = client.photos.filter(Boolean);
    }else if(typeof client.photos === "string"){
        try{
            const parsed = JSON.parse(client.photos);
            if(Array.isArray(parsed)){
                photos = parsed.filter(Boolean);
            }
        }catch(e){
            photos = client.photos
                .split(",")
                .map(function(item){ return item.trim(); })
                .filter(Boolean);
        }
    }

    photos = photos.slice(0,10);

    if(photos.length){

        photosGallery.innerHTML =
            photos.map(function(photo, index){

                return `
                    <div class="photo-item" data-photo-index="${index}">
                        <img
                            src="${validUrl(photo)}"
                            alt="Photo ${index + 1}"
                            loading="lazy">
                    </div>
                `;

            }).join("");

        photosSection.classList.remove("hidden");

        photosGallery
            .querySelectorAll(".photo-item")
            .forEach(function(item){

                item.addEventListener(
                    "click",
                    function(){

                        const index =
                            Number(
                                item.dataset.photoIndex
                            );

                        photoLightboxImage.src =
                            validUrl(photos[index]);

                        photoLightbox.classList.remove(
                            "hidden"
                        );

                    }
                );

            });

    }else{

        photosSection.classList.add("hidden");

    }

    /* PROFILE THEME */
    applyProfileTheme(
        client.theme_color ||
        client.themeColor ||
        "#111111"
    );

    document
        .querySelectorAll(
            "h1, h2"
        )
        .forEach(function(el){
            el.classList.add("theme-accent");
        });

    /* SHOW PROFILE */

    loading.classList.add(
        "hidden"
    );

    errorBox.classList.add(
        "hidden"
    );

    profileContent.classList.remove(
        "hidden"
    );

}


function setupPhoneAction(elementId, phone, label){
    const element = document.getElementById(elementId);
    if(!element) return;
    const value = cleanPhone(phone);
    if(value){
        element.href = "tel:" + value;
        element.querySelector(".action-text").textContent = label;
        element.style.display = "flex";
    }else{
        element.style.display = "none";
    }
}

function setupMapsAction(elementId, textId, url, label){
    const element = document.getElementById(elementId);
    const text = document.getElementById(textId);
    if(!element) return;
    if(url){
        element.href = validUrl(url);
        if(text) text.textContent = label || "Google Maps";
        element.style.display = "flex";
    }else{
        element.style.display = "none";
    }
}

function setupEmailAction(elementId, email, label){
    const element = document.getElementById(elementId);
    if(!element) return;
    if(email){
        element.href = "mailto:" + email;
        element.querySelector(".action-text").textContent = label;
        element.style.display = "flex";
    }else{
        element.style.display = "none";
    }
}

function setupWhatsAppLink(elementId, phone){
    if(!phone){
        setupLink(elementId, null);
        return;
    }
    const number = whatsappPhone(phone);
    setupLink(elementId, number ? "https://wa.me/" + number : null);
}


/* =====================================================
   SETUP LINK
===================================================== */

function setupLink(
    elementId,
    url
){

    const element =
        document.getElementById(
            elementId
        );


    if(!url){

        element.classList.add(
            "hidden"
        );

        return;
    }


    element.href =
        validUrl(url);


    element.classList.remove(
        "hidden"
    );

}


/* =====================================================
   SAVE CONTACT
===================================================== */

let currentClient =
    null;


async function loadProfileAndSetContact(){

    if(!clientId && !slugFromPath){
        return;
    }


    let data = null;

    if (slugFromPath) {
        const result =
            await supabaseClient
                .from("Clients")
                .select("*")
                .eq("slug", slugFromPath)
                .maybeSingle();

        data = result.data;
    } else if (clientId) {
        const result =
            await supabaseClient
                .from("Clients")
                .select("*")
                .eq("id", clientId)
                .maybeSingle();

        data = result.data;
    }


    if(data){

        currentClient =
            data;

    }

}


saveContact.addEventListener(
    "click",
    async function(){

        if(!currentClient){

            await loadProfileAndSetContact();

        }


        if(!currentClient){

            alert(
                "Contact information is not available."
            );

            return;
        }


        const client =
            currentClient;


        const vCard =
`BEGIN:VCARD
VERSION:3.0
N:${escapeVCard(client.name || "")};;;
FN:${escapeVCard(client.name || "")}
ORG:${escapeVCard(client.company || "")}
TITLE:${escapeVCard(client.job || "")}
TEL;TYPE=CELL,VOICE:${escapeVCard(client.phone || "")}
TEL;TYPE=CELL,VOICE:${escapeVCard(client.phone2 || "")}
TEL;TYPE=CELL,VOICE:${escapeVCard(client.phone3 || "")}
EMAIL;TYPE=INTERNET:${escapeVCard(client.email || "")}
EMAIL;TYPE=INTERNET:${escapeVCard(client.email2 || "")}
EMAIL;TYPE=INTERNET:${escapeVCard(client.email3 || "")}
URL;TYPE=WORK:${escapeVCard(client.website || "")}
X-SOCIALPROFILE;TYPE=instagram:${escapeVCard(client.instagram || "")}
X-SOCIALPROFILE;TYPE=facebook:${escapeVCard(client.facebook || "")}
X-SOCIALPROFILE;TYPE=linkedin:${escapeVCard(client.linkedin || "")}
X-SOCIALPROFILE;TYPE=whatsapp:${escapeVCard(client.whatsapp ? "https://wa.me/" + whatsappPhone(client.whatsapp) : "")}
X-SOCIALPROFILE;TYPE=whatsapp:${escapeVCard(client.whatsapp2 ? "https://wa.me/" + whatsappPhone(client.whatsapp2) : "")}
X-SOCIALPROFILE;TYPE=whatsapp:${escapeVCard(client.whatsapp3 ? "https://wa.me/" + whatsappPhone(client.whatsapp3) : "")}
URL:${escapeVCard(client.website || "")}
item1.URL:${escapeVCard(client.maps_link || "")}
item1.X-ABLabel:${escapeVCard(client.maps_label || "Magasin 1")}
item2.URL:${escapeVCard(client.maps_link2 || "")}
item2.X-ABLabel:${escapeVCard(client.maps_label2 || "Magasin 2")}
item3.URL:${escapeVCard(client.maps_link3 || "")}
item3.X-ABLabel:${escapeVCard(client.maps_label3 || "Magasin 3")}
NOTE:${escapeVCard(client.about || "")}
END:VCARD`;


        const blob =
            new Blob(
                [vCard],
                {
                    type:"text/vcard;charset=utf-8"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement("a");


        a.href =
            url;


        a.download =
            (client.name ||
             "contact") +
            ".vcf";


        document.body.appendChild(a);

        a.click();

        a.remove();


        URL.revokeObjectURL(
            url
        );

    }
);

loadProfile()
