<script>


/* =========================
   SUPABASE
========================= */


const SUPABASE_URL =
    "https://sxnthstllporbicsdbjk.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Jnbgc4Z3e4p1KvPSAggX0w_m17LC7G_";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



/* =========================
   ELEMENTS
========================= */


const loginPage =
    document.getElementById("loginPage");


const dashboard =
    document.getElementById("dashboard");


const loginForm =
    document.getElementById("loginForm");


const loginButton =
    document.getElementById("loginButton");


const loginError =
    document.getElementById("loginError");


const logoutButton =
    document.getElementById("logoutButton");


const addClientButton =
    document.getElementById("addClientButton");


const clientModal =
    document.getElementById("clientModal");


const closeClientModal =
    document.getElementById("closeClientModal");


const cancelClientButton =
    document.getElementById("cancelClientButton");


const clientForm =
    document.getElementById("clientForm");


const saveClientButton =
    document.getElementById("saveClientButton");


const clientMessage =
    document.getElementById("clientMessage");


const clientList =
    document.getElementById("clientList");


const searchClient =
    document.getElementById("searchClient");


const totalClients =
    document.getElementById("totalClients");


const activeProfiles =
    document.getElementById("activeProfiles");


const nfcCards =
    document.getElementById("nfcCards");



/* =========================
   LOGIN / DASHBOARD
========================= */


function showDashboard() {

    loginPage.style.display = "none";

    dashboard.style.display = "block";

    loadClients();

}


function showLogin() {

    loginPage.style.display = "flex";

    dashboard.style.display = "none";

}



/* =========================
   LOGIN
========================= */


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        loginError.style.display = "none";


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const { error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            loginError.textContent =
                error.message;

            loginError.style.display =
                "block";


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";


            return;

        }


        showDashboard();


        loginButton.disabled =
            false;

        loginButton.textContent =
            "Login";

    }
);



/* =========================
   LOGOUT
========================= */


logoutButton.addEventListener(
    "click",
    async function() {

        await supabaseClient.auth.signOut();

        showLogin();

    }
);



/* =========================
   SESSION
========================= */


async function checkSession() {

    const { data } =
        await supabaseClient.auth.getSession();


    if (data.session) {

        showDashboard();

    } else {

        showLogin();

    }

}



/* =========================
   ADD CLIENT MODAL
========================= */


addClientButton.addEventListener(
    "click",
    function() {

        clientMessage.style.display =
            "none";

        clientMessage.textContent =
            "";

        clientMessage.className =
            "form-message";


        clientForm.reset();


        clientModal.style.display =
            "flex";

    }
);



closeClientModal.addEventListener(
    "click",
    function() {

        clientModal.style.display =
            "none";

    }
);



cancelClientButton.addEventListener(
    "click",
    function() {

        clientModal.style.display =
            "none";

    }
);



clientModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target === clientModal
        ) {

            clientModal.style.display =
                "none";

        }

    }
);



/* =========================
   SAVE CLIENT
========================= */


clientForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        saveClientButton.disabled =
            true;

        saveClientButton.textContent =
            "Saving...";


        clientMessage.style.display =
            "none";


        const formData =
            new FormData(clientForm);


        const client = {

            name:
                formData.get("name")
                ?.trim() || null,

            company:
                formData.get("company")
                ?.trim() || null,

            phone:
                formData.get("phone")
                ?.trim() || null,

            whatsapp:
                formData.get("whatsapp")
                ?.trim() || null,

            email:
                formData.get("email")
                ?.trim() || null,

            website:
                formData.get("website")
                ?.trim() || null,

            instagram:
                formData.get("instagram")
                ?.trim() || null,

            linkedin:
                formData.get("linkedin")
                ?.trim() || null,

            facebook:
                formData.get("facebook")
                ?.trim() || null,

            about:
                formData.get("about")
                ?.trim() || null,

            photo:
                formData.get("photo")
                ?.trim() || null,

            cover:
                formData.get("cover")
                ?.trim() || null

        };


        const { error } =
            await supabaseClient
                .from("Clients")
                .insert([client]);


        if (error) {

            console.error(error);


            clientMessage.textContent =
                "Error: " +
                error.message;


            clientMessage.className =
                "form-message error";


            clientMessage.style.display =
                "block";


            saveClientButton.disabled =
                false;

            saveClientButton.textContent =
                "Save Client";


            return;

        }


        clientMessage.textContent =
            "Client added successfully!";


        clientMessage.className =
            "form-message success";


        clientMessage.style.display =
            "block";


        await loadClients();


        setTimeout(
            function() {

                clientModal.style.display =
                    "none";

                clientForm.reset();

            },
            700
        );


        saveClientButton.disabled =
            false;

        saveClientButton.textContent =
            "Save Client";

    }
);



/* =========================
   LOAD CLIENTS
========================= */


let allClients = [];


async function loadClients() {


    const { data, error } =
        await supabaseClient
            .from("Clients")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);


        clientList.innerHTML = `

            <div class="empty">

                Error loading clients:
                ${escapeHtml(error.message)}

            </div>

        `;

        return;

    }


    allClients = data || [];


    totalClients.textContent =
        allClients.length;


    activeProfiles.textContent =
        allClients.filter(
            client => client.active !== false
        ).length;


    nfcCards.textContent =
        allClients.filter(
            client => client.nfc_uid
        ).length;


    renderClients(allClients);

}



/* =========================
   RENDER CLIENTS
========================= */


function renderClients(clients) {


    if (!clients.length) {

        clientList.innerHTML = `

            <div class="empty">

                No clients yet.

                <br><br>

                Click
                <strong>+ Add Client</strong>
                to create your first client.

            </div>

        `;

        return;

    }


    clientList.innerHTML =
        clients.map(
            client => {


                const photo =
                    client.photo;


                const avatar =
                    photo

                    ?

                    `
                    <img
                        src="${escapeAttribute(photo)}"
                        alt="">
                    `

                    :

                    `👤`;


                return `

                    <div class="client">

                        <div class="client-info">

                            <div class="avatar">

                                ${avatar}

                            </div>


                            <div>

                                <div class="client-name">

                                    ${escapeHtml(
                                        client.name || "Unnamed"
                                    )}

                                </div>


                                <div class="client-company">

                                    ${escapeHtml(
                                        client.company || "No company"
                                    )}

                                </div>

                            </div>

                        </div>


                        <div class="client-actions">

                            <span class="status">

                                Active

                            </span>


                            <a
                                href="index.html?id=${encodeURIComponent(client.id)}"
                                target="_blank"
                                class="view-btn">

                                View

                            </a>

                        </div>

                    </div>

                `;

            }
        ).join("");

}



/* =========================
   SEARCH
========================= */


searchClient.addEventListener(
    "input",
    function() {


        const query =
            searchClient.value
                .toLowerCase()
                .trim();


        if (!query) {

            renderClients(allClients);

            return;

        }


        const filtered =
