<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartLink NFC - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #111;
}

.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 35px;
    border-radius: 18px;
}

.login-logo {
    text-align: center;
    font-size: 27px;
    font-weight: bold;
}

.login-subtitle {
    text-align: center;
    color: #777;
    margin: 8px 0 30px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
}

.form-group input,
.client-form input,
.client-form textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
}

.login-btn,
.save-btn {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #111;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.login-error {
    display: none;
    background: #ffe8e8;
    color: #c00;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
}

/* DASHBOARD */

.dashboard {
    display: none;
    min-height: 100vh;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 240px;
    background: #111;
    color: white;
    padding: 25px 18px;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 40px;
}

.logo span {
    color: #999;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.menu a {
    color: #bbb;
    text-decoration: none;
    padding: 13px 15px;
    border-radius: 10px;
}

.menu a:hover,
.menu a.active {
    background: #292929;
    color: white;
}

.logout {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 25px;
    padding: 12px;
    background: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 10px;
    cursor: pointer;
}

.main {
    margin-left: 240px;
    padding: 35px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.topbar h1 {
    font-size: 28px;
}

.topbar p {
    color: #777;
    margin-top: 6px;
}

.add-btn {
    background: #111;
    color: white;
    border: 0;
    padding: 13px 20px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

/* STATS */

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 24px;
    border-radius: 15px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.card-title {
    color: #777;
    font-size: 14px;
    margin-bottom: 12px;
}

.card-number {
    font-size: 30px;
    font-weight: bold;
}

/* CLIENTS */

.clients-box {
    background: white;
    padding: 25px;
    border-radius: 15px;
}

.clients-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.search {
    width: 250px;
    padding: 11px 14px;
    border: 1px solid #ddd;
    border-radius: 9px;
}

.client {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 0;
    border-top: 1px solid #eee;
}

.client-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-size: 22px;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.client-name {
    font-weight: bold;
    margin-bottom: 4px;
}

.client-company {
    color: #777;
    font-size: 13px;
}

.client-actions {
    display: flex;
    gap: 8px;
    align-items: center;
}

.action-btn {
    border: 0;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
}

.view-btn {
    background: #eee;
}

.edit-btn {
    background: #111;
    color: white;
}

.delete-btn {
    background: #ffe5e5;
    color: #c00;
}

.status {
    background: #e8f7ed;
    color: #198754;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
}

.empty {
    text-align: center;
    padding: 40px;
    color: #777;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-box {
    width: 100%;
    max-width: 780px;
    max-height: 92vh;
    overflow-y: auto;
    background: white;
    border-radius: 18px;
    padding: 30px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.close-btn {
    border: 0;
    background: #eee;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
}

.client-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.client-form textarea {
    min-height: 120px;
    resize: vertical;
}

.full {
    grid-column: 1 / -1;
}

.file-box {
    border: 2px dashed #ddd;
    padding: 16px;
    border-radius: 12px;
    background: #fafafa;
}

.file-box label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

.file-box input {
    border: 0;
    padding: 0;
    background: transparent;
}

.preview {
    display: none;
    margin-top: 12px;
}

.preview img {
    max-width: 140px;
    max-height: 100px;
    border-radius: 10px;
    object-fit: cover;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 10px;
}

.cancel-btn {
    padding: 12px 20px;
    border: 0;
    border-radius: 9px;
    background: #eee;
    cursor: pointer;
    font-weight: bold;
}

.save-btn {
    width: auto;
    padding: 12px 25px;
}

.form-message {
    display: none;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.form-message.error {
    display: block;
    background: #ffe8e8;
    color: #c00;
}

.form-message.success {
    display: block;
    background: #e8f8ee;
    color: #08752f;
}

.progress {
    display: none;
    margin-top: 10px;
    color: #666;
    font-size: 13px;
}

/* MOBILE */

@media(max-width:800px) {

    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .logout {
        position: relative;
        left: auto;
        right: auto;
        bottom: auto;
        width: 100%;
        margin-top: 20px;
    }

    .main {
        margin-left: 0;
        padding: 20px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .clients-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .search {
        width: 100%;
    }

    .client {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .client-actions {
        margin-left: 67px;
        flex-wrap: wrap;
    }

    .client-form {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div class="login-page" id="loginPage">

    <div class="login-box">

        <div class="login-logo">
            SmartLink NFC
        </div>

        <div class="login-subtitle">

        </div>

<!-- =====================================================

            <div>

                <input

                <label>Phone</label>

                    name="phone"

            </div>


            <div>

                <input

                    placeholder="+212...">

            </div>


            <div>

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="email@example.com">

            </div>


            <div>

                <label>Website</label>

                <input
                    type="text"
                    name="website"
                    placeholder="https://...">

            </div>


            <div>

                <label>Instagram</label>

                <input

            </div>


            <div>

                <label>LinkedIn</label>

            <div class="file-box">

                <label>🖼️ Cover Photo</label>

                <input
                    type="file"

                <div

            <textarea

            <div

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div class="dashboard" id="dashboard">

    <aside class="sidebar">

        <div class="logo">
            SmartLink <span>NFC</span>
        </div>


        <nav class="menu">

            <a
                href="#"
                class="active">

                🏠 Dashboard

            </a>

            <a href="#clients">

                👥 Clients

            </a>

            <a href="#">

                📱 NFC Cards

            </a>

            <a href="#">

                📊 Analytics

            </a>

        </nav>


        <button
            class="logout"
            id="logoutButton">

            🚪 Logout

        </button>

    </aside>


    <main class="main">

        <div class="topbar">

            <div>

                <h1>
                    Dashboard
                </h1>

                <p>
                    Manage your SmartLink NFC clients.
                </p>

            </div>


            <button
                class="add-btn"
                id="addClientButton"

            <div class="card">

                    Active Profiles

                    id="activeProfiles">

            <div class="card">

                    id="searchClient"

                id="clientList">

                </div>

            </div>

        </div>

    </main>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://sxnthstllporbicsdbjk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Jnbgc4Z3e4p1KvPSAggX0w_m17LC7G_";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ELEMENTS
========================================================= */

const loginPage =
    document.getElementById("loginPage");

const dashboard =
    document.getElementById("dashboard");

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const loginError =
    document.getElementById("loginError");

const logoutButton =
    document.getElementById("logoutButton");

const addClientButton =
    document.getElementById("addClientButton");

const clientModal =
    document.getElementById("clientModal");

const closeModal =
    document.getElementById("closeModal");

const cancelModal =
    document.getElementById("cancelModal");

const clientForm =
    document.getElementById("clientForm");

const saveClientButton =
    document.getElementById("saveClientButton");

const formMessage =
    document.getElementById("formMessage");

const modalTitle =
    document.getElementById("modalTitle");

const clientList =
    document.getElementById("clientList");

const searchClient =
    document.getElementById("searchClient");

const totalClients =
    document.getElementById("totalClients");

const activeProfiles =
    document.getElementById("activeProfiles");

const nfcCards =
    document.getElementById("nfcCards");

const photoFile =
    document.getElementById("photoFile");

const coverFile =
    document.getElementById("coverFile");

const photoPreview =
    document.getElementById("photoPreview");

const photoPreviewImg =
    document.getElementById("photoPreviewImg");

const coverPreview =
    document.getElementById("coverPreview");

const coverPreviewImg =
    document.getElementById("coverPreviewImg");

const uploadProgress =
    document.getElementById("uploadProgress");


let clients = [];

let editingClientId = null;


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        loginError.style.display = "none";

        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const { error } =
            await supabaseClient.auth
                .signInWithPassword({
                    email: email,
                    password: password
                });


        if(error){

            loginError.textContent =
                error.message;

            loginError.style.display =
                "block";

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

            return;
        }


        showDashboard();


        loginButton.disabled =
            false;

        loginButton.textContent =
            "Login";

    }
);


/* =========================================================
   SESSION
========================================================= */

async function checkSession(){

    const { data } =
        await supabaseClient.auth
            .getSession();


    if(data.session){

        showDashboard();

    }else{

        showLogin();

    }
}


function showDashboard(){

    loginPage.style.display =
        "none";

    dashboard.style.display =
        "block";

    loadClients();
}


function showLogin(){

    loginPage.style.display =
        "flex";

    dashboard.style.display =
        "none";
}


/* =========================================================
   LOGOUT
========================================================= */

logoutButton.addEventListener(
    "click",
    async function(){

        await supabaseClient.auth.signOut();

        showLogin();

    }
);


/* =========================================================
   OPEN ADD CLIENT
========================================================= */

addClientButton.addEventListener(
    "click",
    function(){

        editingClientId = null;

        modalTitle.textContent =
            "Add Client";

        saveClientButton.textContent =
            "Save Client";

        clientForm.reset();

        resetPreviews();

        hideMessage();

        clientModal.style.display =
            "flex";

    }
);


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeClientModal(){

    clientModal.style.display =
        "none";

    editingClientId = null;

    clientForm.reset();

    resetPreviews();

    hideMessage();

    uploadProgress.style.display =
        "none";
}


closeModal.addEventListener(
    "click",
    closeClientModal
);


cancelModal.addEventListener(
    "click",
    closeClientModal
);


clientModal.addEventListener(
    "click",
    function(event){

        if(event.target === clientModal){

            closeClientModal();

        }

    }
);


/* =========================================================
   IMAGE PREVIEW
========================================================= */

photoFile.addEventListener(
    "change",
    function(){

        previewFile(
            photoFile.files[0],
            photoPreview,
            photoPreviewImg
        );

    }
);


coverFile.addEventListener(
    "change",
    function(){

        previewFile(
            coverFile.files[0],
            coverPreview,
            coverPreviewImg
        );

    }
);


function previewFile(
    file,
    container,
    image
){

    if(!file){

        container.style.display =
            "none";

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(event){

            image.src =
                event.target.result;

            container.style.display =
                "block";

        };


    reader.readAsDataURL(file);

}


function resetPreviews(){

    photoPreview.style.display =
        "none";

    coverPreview.style.display =
        "none";

    photoPreviewImg.src =
        "";

    coverPreviewImg.src =
        "";

}


/* =========================================================
   UPLOAD IMAGE
========================================================= */

async function uploadImage(
    file,
    bucket,
    clientId,
    type
){

    if(!file){

        return null;
    }


    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const fileName =
        clientId +
        "-" +
        Date.now() +
        "." +
        extension;


    const filePath =
        clientId +
        "/" +
        fileName;


    const { error } =
        await supabaseClient.storage
            .from(bucket)
            .upload(
                filePath,
                file,
                {
                    cacheControl: "3600",
                    upsert: true,
                    contentType: file.type
                }
            );


    if(error){

        throw error;

    }


    const { data } =
        supabaseClient.storage
            .from(bucket)
            .getPublicUrl(filePath);


    return data.publicUrl;

}


/* =========================================================
   SAVE / UPDATE CLIENT
========================================================= */

clientForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        saveClientButton.disabled =
            true;

        saveClientButton.textContent =
            "Saving...";


        hideMessage();


        try {

            const formData =
                new FormData(clientForm);


            const client = {

                name:
                    formData.get("name")?.trim() || null,

                job:
                    formData.get("job")?.trim() || null,

                company:
                    formData.get("company")?.trim() || null,

                phone:
                    formData.get("phone")?.trim() || null,

                whatsapp:
                    formData.get("whatsapp")?.trim() || null,

                email:
                    formData.get("email")?.trim() || null,

                website:
                    formData.get("website")?.trim() || null,

                instagram:
                    formData.get("instagram")?.trim() || null,

                facebook:
                    formData.get("facebook")?.trim() || null,

                linkedin:
                    formData.get("linkedin")?.trim() || null,

                about:
                    formData.get("about")?.trim() || null

            };


            /* =================================================
               CREATE CLIENT FIRST
            ================================================= */

            let clientId =
                editingClientId;


            if(!editingClientId){

                const { data, error } =
                    await supabaseClient
                        .from("Clients")
                        .insert([client])
                        .select("id")
                        .single();


                if(error){

                    throw error;

                }


                clientId =
                    data.id;

            }


            /* =================================================
               UPLOAD PHOTO
            ================================================= */

            if(photoFile.files[0]){

                uploadProgress.style.display =
                    "block";

                uploadProgress.textContent =
                    "Uploading profile photo...";


                client.photo =
                    await uploadImage(
                        photoFile.files[0],
                        "profile-photos",
                        clientId,
                        "photo"
                    );

            }


            /* =================================================
               UPLOAD COVER
            ================================================= */

            if(coverFile.files[0]){

                uploadProgress.textContent =
                    "Uploading cover photo...";


                client.cover =
                    await uploadImage(
                        coverFile.files[0],
                        "cover-photos",
                        clientId,
                        "cover"
                    );

            }


            /* =================================================
               UPDATE CLIENT
            ================================================= */

            if(editingClientId){

                const { error } =
                    await supabaseClient
                        .from("Clients")
                        .update(client)
                        .eq(
                            "id",
                            editingClientId
                        );


                if(error){

                    throw error;

                }

            }else{

                /*
                 * If new client was created,
                 * update it with photo/cover URLs.
                 */

                if(client.photo || client.cover){

                    const { error } =
                        await supabaseClient
                            .from("Clients")
                            .update({
                                photo:
                                    client.photo || null,

                                cover:
                                    client.cover || null
                            })
                            .eq(
                                "id",
                                clientId
                            );


                    if(error){

                        throw error;

                    }

                }

            }


            showMessage(
                editingClientId
                    ? "Client updated successfully!"
                    : "Client added successfully!",
                "success"
            );


            await loadClients();


            setTimeout(
                closeClientModal,
                800
            );


        } catch(error){

            console.error(error);

            showMessage(
                "Error: " +
                error.message,
                "error"
            );

        }


        saveClientButton.disabled =
            false;

        saveClientButton.textContent =
            editingClientId
                ? "Update Client"
                : "Save Client";

    }
);


/* =========================================================
   LOAD CLIENTS
========================================================= */

async function loadClients(){

    const { data, error } =
        await supabaseClient
            .from("Clients")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(error);

        clientList.innerHTML = `
            <div class="empty">
                Error loading clients:<br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }


    clients =
        data || [];


    totalClients.textContent =
        clients.length;


    activeProfiles.textContent =
        clients.length;


    /*
     * NFC cards are managed later.
     */

    nfcCards.textContent =
        0;


    renderClients(clients);

}


/* =========================================================
   RENDER CLIENTS
========================================================= */

function renderClients(list){

    if(!list.length){

        clientList.innerHTML = `
            <div class="empty">
                No clients found.
            </div>
        `;

        return;
    }


    clientList.innerHTML =
        list.map(
            function(client){

                const avatar =
                    client.photo
                    ?
                    `<img
                        src="${escapeAttribute(client.photo)}"
                        alt="">`
                    :
                    "👤";


                return `

                    <div class="client">

                        <div class="client-info">

                            <div class="avatar">
                                ${avatar}
                            </div>

                            <div>

                                <div class="client-name">
                                    ${escapeHtml(
                                        client.name ||
                                        "Unnamed Client"
                                    )}
                                </div>

                                <div class="client-company">
                                    ${escapeHtml(
                                        client.company ||
                                        client.job ||
                                        "No company"
                                    )}
                                </div>

                            </div>

                        </div>


                        <div class="client-actions">

                            <span class="status">
                                Active
                            </span>


                            <button
                                class="action-btn view-btn"
                                onclick="viewClient('${client.id}')">

                                👁 View

                            </button>


                            <button
                                class="action-btn edit-btn"
                                onclick="editClient('${client.id}')">

                                ✏️ Edit

                            </button>


                            <button
                                class="action-btn delete-btn"
                                onclick="deleteClient('${client.id}')">

                                🗑 Delete

                            </button>

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* =========================================================
   VIEW PROFILE
========================================================= */

function viewClient(id){

    const url =
        window.location.origin +
        window.location.pathname.replace(
            "admin.html",
            "index.html"
        ) +
        "?id=" +
        encodeURIComponent(id);


    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   EDIT CLIENT
========================================================= */

function editClient(id){

    const client =
        clients.find(
            function(item){

                return String(item.id) ===
                    String(id);

            }
        );


    if(!client){

        alert("Client not found.");

        return;
    }


    editingClientId =
        id;


    modalTitle.textContent =
        "Edit Client";


    saveClientButton.textContent =
        "Update Client";


    clientForm.elements["name"].value =
        client.name || "";


    clientForm.elements["job"].value =
        client.job || "";


    clientForm.elements["company"].value =
        client.company || "";


    clientForm.elements["phone"].value =
        client.phone || "";


    clientForm.elements["whatsapp"].value =
        client.whatsapp || "";


    clientForm.elements["email"].value =
        client.email || "";


    clientForm.elements["website"].value =
        client.website || "";


    clientForm.elements["instagram"].value =
        client.instagram || "";


    clientForm.elements["facebook"].value =
        client.facebook || "";


    clientForm.elements["linkedin"].value =
        client.linkedin || "";


    clientForm.elements["about"].value =
        client.about || "";


    resetPreviews();

    hideMessage();


    clientModal.style.display =
        "flex";

}


/* =========================================================
   DELETE CLIENT
========================================================= */

async function deleteClient(id){

    const client =
        clients.find(
            function(item){

                return String(item.id) ===
                    String(id);

            }
        );


    if(!client){

        alert("Client not found.");

        return;
    }


    const confirmed =
        confirm(
            "Delete " +
            (client.name || "this client") +
            "?"
        );


    if(!confirmed){

        return;
    }


    const { error } =
        await supabaseClient
            .from("Clients")
            .delete()
            .eq(
                "id",
                id
            );


    if(error){

        alert(
            "Error deleting client: " +
            error.message
        );

        return;
    }


    await loadClients();

}


/* =========================================================
   SEARCH
========================================================= */

searchClient.addEventListener(
    "input",
    function(){

        const query =
            searchClient.value
                .toLowerCase()
                .trim();


        if(!query){

            renderClients(clients);

            return;
        }


        const filtered =
            clients.filter(
                function(client){

                    return (

                        String(
                            client.name || ""
                        )
                        .toLowerCase()
                        .includes(query)

                        ||

                        String(
                            client.company || ""
                        )
                        .toLowerCase()
                        .includes(query)

                        ||

                        String(
                            client.email || ""
                        )
                        .toLowerCase()
                        .includes(query)

                        ||

                        String(
                            client.phone || ""
                        )
                        .toLowerCase()
                        .includes(query)

                    );

                }
            );


        renderClients(filtered);

    }
);


/* =========================================================
   MESSAGES
========================================================= */

function showMessage(
    message,
    type
){

    formMessage.textContent =
        message;

    formMessage.className =
        "form-message " +
        type;

}


function hideMessage(){

    formMessage.textContent =
        "";

    formMessage.className =
        "form-message";

}


/* =========================================================
   SECURITY / HTML
========================================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttribute(value){

    return escapeHtml(value);

}


/* =========================================================
   START
========================================================= */

checkSession();

</script>
