<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartLink NFC - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#111;
}

/* LOGIN */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:18px;
}

.login-logo{
    text-align:center;
    font-size:27px;
    font-weight:bold;
}

.login-subtitle{
    text-align:center;
    color:#777;
    margin:8px 0 30px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

.form-group input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

.login-btn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#111;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.login-error{
    display:none;
    background:#ffe8e8;
    color:#c00;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
}

/* DASHBOARD */

.dashboard{
    display:none;
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:240px;
    background:#111;
    color:white;
    padding:25px 18px;
}

.logo{
    font-size:21px;
    font-weight:bold;
    margin-bottom:40px;
}

.logo span{
    color:#999;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu a{
    color:#bbb;
    text-decoration:none;
    padding:13px 15px;
    border-radius:10px;
}

.menu a:hover,
.menu a.active{
    background:#292929;
    color:white;
}

.logout{
    position:absolute;
    left:18px;
    right:18px;
    bottom:25px;
    padding:12px;
    background:#222;
    color:white;
    border:1px solid #444;
    border-radius:10px;
    cursor:pointer;
}

.main{
    margin-left:240px;
    padding:35px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.topbar h1{
    font-size:28px;
}

.topbar p{
    color:#777;
    margin-top:6px;
}

.add-btn{
    background:#111;
    color:white;
    border:0;
    padding:13px 20px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* CARDS */

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:24px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.card-title{
    color:#777;
    font-size:14px;
    margin-bottom:12px;
}

.card-number{
    font-size:30px;
    font-weight:bold;
}

/* CLIENTS */

.clients-box{
    background:white;
    padding:25px;
    border-radius:15px;
}

.clients-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.search{
    width:250px;
    padding:11px 14px;
    border:1px solid #ddd;
    border-radius:9px;
}

.client{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 0;
    border-top:1px solid #eee;
}

.client-info{
    display:flex;
    align-items:center;
    gap:15px;
}

.avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:22px;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.client-name{
    font-weight:bold;
    margin-bottom:4px;
}

.client-company{
    color:#777;
    font-size:13px;
}

.client-actions{
    display:flex;
    gap:8px;
    align-items:center;
}

.action-btn{
    border:0;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
}

.view-btn{
    background:#eee;
}

.edit-btn{
    background:#111;
    color:white;
}

.delete-btn{
    background:#ffe5e5;
    color:#c00;
}

.status{
    background:#e8f7ed;
    color:#198754;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
}

.empty{
    text-align:center;
    padding:40px;
    color:#777;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:750px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:16px;
    padding:30px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.close-btn{
    border:0;
    background:#eee;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:22px;
    cursor:pointer;
}

.client-form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.client-form input,
.client-form textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:14px;
}

.client-form textarea{
    grid-column:1/-1;
    min-height:110px;
    resize:vertical;
}

.full{
    grid-column:1/-1;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:10px;
}

.cancel-btn,
.save-btn{
    padding:12px 20px;
    border:0;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.cancel-btn{
    background:#eee;
}

.save-btn{
    background:#111;
    color:white;
}

.form-message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
}

.form-message.error{
    display:block;
    background:#ffe8e8;
    color:#c00;
}

.form-message.success{
    display:block;
    background:#e8f8ee;
    color:#08752f;
}

@media(max-width:800px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .logout{
        position:relative;
        left:auto;
        right:auto;
        bottom:auto;
        width:100%;
        margin-top:20px;
    }

    .main{
        margin-left:0;
        padding:20px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .clients-header{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .search{
        width:100%;
    }

    .client{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .client-actions{
        margin-left:67px;
        flex-wrap:wrap;
    }

    .client-form{
        grid-template-columns:1fr;
    }

    .client-form textarea,
    .full{
        grid-column:auto;
    }
}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-page" id="loginPage">

    <div class="login-box">

        <div class="login-logo">
            SmartLink NFC
        </div>

        <div class="login-subtitle">
            Admin Dashboard
        </div>

        <div class="login-error" id="loginError"></div>

        <form id="loginForm">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="admin@example.com"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

            </div>

            <button
                class="login-btn"
                id="loginButton"
                type="submit">

                Login

            </button>

        </form>

    </div>

</div>


<!-- ADD / EDIT MODAL -->

<div class="modal" id="clientModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add Client
            </h2>

            <button
                class="close-btn"
                id="closeModal"
                type="button">

                ×

            </button>

        </div>


        <div
            class="form-message"
            id="formMessage">
        </div>


        <form
            id="clientForm"
            class="client-form">


            <input
                type="text"
                name="name"
                placeholder="Full Name *"
                required>


            <input
                type="text"
                name="job"
                placeholder="Job / Position">


            <input
                type="text"
                name="company"
                placeholder="Company">


            <input
                type="text"
                name="phone"
                placeholder="Phone">


            <input
                type="text"
                name="whatsapp"
                placeholder="WhatsApp">


            <input
                type="email"
                name="email"
                placeholder="Email">


            <input
                type="text"
                name="website"
                placeholder="Website">


            <input
                type="text"
                name="instagram"
                placeholder="Instagram URL">


            <input
                type="text"
                name="facebook"
                placeholder="Facebook URL">


            <input
                type="text"
                name="linkedin"
                placeholder="LinkedIn URL">


            <input
                type="text"
                name="photo"
                placeholder="Photo URL">


            <input
                type="text"
                name="cover"
                placeholder="Cover URL">


            <textarea
                name="about"
                placeholder="About / Bio">
            </textarea>


            <div class="modal-actions full">

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelModal">

                    Cancel

                </button>


                <button
                    type="submit"
                    class="save-btn"
                    id="saveClientButton">

                    Save Client

                </button>

            </div>

        </form>

    </div>

</div>


<!-- DASHBOARD -->

<div class="dashboard" id="dashboard">

    <aside class="sidebar">

        <div class="logo">

            SmartLink <span>NFC</span>

        </div>


        <nav class="menu">

            <a
                href="#"
                class="active">

                🏠 Dashboard

            </a>

            <a href="#clients">

                👥 Clients

            </a>

            <a href="#">

                📱 NFC Cards

            </a>

            <a href="#">

                📊 Analytics

            </a>

        </nav>


        <button
            class="logout"
            id="logoutButton">

            🚪 Logout

        </button>

    </aside>


    <main class="main">

        <div class="topbar">

            <div>

                <h1>
                    Dashboard
                </h1>

                <p>
                    Manage your SmartLink NFC clients.
                </p>

            </div>


            <button
                class="add-btn"
                id="addClientButton"
                type="button">

                + Add Client

            </button>

        </div>


        <!-- STATISTICS -->

        <div class="cards">

            <div class="card">

                <div class="card-title">
                    Total Clients
                </div>

                <div
                    class="card-number"
                    id="totalClients">

                    0

                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Active Profiles
                </div>

                <div
                    class="card-number"
                    id="activeProfiles">

                    0

                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    NFC Cards
                </div>

                <div
                    class="card-number"
                    id="nfcCards">

                    0

                </div>

            </div>

        </div>


        <!-- CLIENTS -->

        <div
            class="clients-box"
            id="clients">

            <div class="clients-header">

                <h2>
                    Clients
                </h2>

                <input
                    class="search"
                    id="searchClient"
                    placeholder="Search client...">

            </div>


            <div
                class="client-list"
                id="clientList">

                <div class="empty">
                    Loading clients...
                </div>

            </div>

        </div>

    </main>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://sxnthstllporbicsdbjk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Jnbgc4Z3e4p1KvPSAggX0w_m17LC7G_";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ELEMENTS
========================================================= */

const loginPage =
    document.getElementById("loginPage");

const dashboard =
    document.getElementById("dashboard");

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const loginError =
    document.getElementById("loginError");

const logoutButton =
    document.getElementById("logoutButton");

const addClientButton =
    document.getElementById("addClientButton");

const clientModal =
    document.getElementById("clientModal");

const closeModal =
    document.getElementById("closeModal");

const cancelModal =
    document.getElementById("cancelModal");

const clientForm =
    document.getElementById("clientForm");

const saveClientButton =
    document.getElementById("saveClientButton");

const formMessage =
    document.getElementById("formMessage");

const modalTitle =
    document.getElementById("modalTitle");

const clientList =
    document.getElementById("clientList");

const searchClient =
    document.getElementById("searchClient");

const totalClients =
    document.getElementById("totalClients");

const activeProfiles =
    document.getElementById("activeProfiles");

const nfcCards =
    document.getElementById("nfcCards");


let clients = [];

let editingClientId = null;


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        loginError.style.display = "none";

        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const { error } =
            await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        if(error){

            loginError.textContent =
                error.message;

            loginError.style.display =
                "block";

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

            return;
        }


        showDashboard();


        loginButton.disabled =
            false;

        loginButton.textContent =
            "Login";

    }
);


/* =========================================================
   SESSION
========================================================= */

async function checkSession(){

    const { data } =
        await supabaseClient.auth
            .getSession();


    if(data.session){

        showDashboard();

    }else{

        showLogin();

    }

}


function showDashboard(){

    loginPage.style.display =
        "none";

    dashboard.style.display =
        "block";

    loadClients();

}


function showLogin(){

    loginPage.style.display =
        "flex";

    dashboard.style.display =
        "none";

}


/* =========================================================
   LOGOUT
========================================================= */

logoutButton.addEventListener(
    "click",
    async function(){

        await supabaseClient.auth.signOut();

        showLogin();

    }
);


/* =========================================================
   OPEN ADD CLIENT
========================================================= */

addClientButton.addEventListener(
    "click",
    function(){

        editingClientId = null;

        modalTitle.textContent =
            "Add Client";

        saveClientButton.textContent =
            "Save Client";

        clientForm.reset();

        hideMessage();

        clientModal.style.display =
            "flex";

    }
);


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeClientModal(){

    clientModal.style.display =
        "none";

    editingClientId = null;

    clientForm.reset();

    hideMessage();

}


closeModal.addEventListener(
    "click",
    closeClientModal
);


cancelModal.addEventListener(
    "click",
    closeClientModal
);


clientModal.addEventListener(
    "click",
    function(event){

        if(event.target === clientModal){

            closeClientModal();

        }

    }
);


/* =========================================================
   SAVE / UPDATE CLIENT
========================================================= */

clientForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        saveClientButton.disabled =
            true;

        saveClientButton.textContent =
            "Saving...";


        hideMessage();


        const formData =
            new FormData(clientForm);


        const client = {

            name:
                formData.get("name")?.trim() || null,

            job:
                formData.get("job")?.trim() || null,

            company:
                formData.get("company")?.trim() || null,

            phone:
                formData.get("phone")?.trim() || null,

            whatsapp:
                formData.get("whatsapp")?.trim() || null,

            email:
                formData.get("email")?.trim() || null,

            website:
                formData.get("website")?.trim() || null,

            instagram:
                formData.get("instagram")?.trim() || null,

            facebook:
                formData.get("facebook")?.trim() || null,

            linkedin:
                formData.get("linkedin")?.trim() || null,

            photo:
                formData.get("photo")?.trim() || null,

            cover:
                formData.get("cover")?.trim() || null,

            about:
                formData.get("about")?.trim() || null

        };


        let result;


        if(editingClientId){

            result =
                await supabaseClient
                    .from("Clients")
                    .update(client)
                    .eq("id", editingClientId);

        }else{

            result =
                await supabaseClient
                    .from("Clients")
                    .insert([client]);

        }


        if(result.error){

            console.error(result.error);

            showMessage(
                "Error: " +
                result.error.message,
                "error"
            );

            saveClientButton.disabled =
                false;

            saveClientButton.textContent =
                editingClientId
                    ? "Update Client"
                    : "Save Client";

            return;
        }


        showMessage(
            editingClientId
                ? "Client updated successfully!"
                : "Client added successfully!",
            "success"
        );


        await loadClients();


        setTimeout(
            closeClientModal,
            700
        );


        saveClientButton.disabled =
            false;

        saveClientButton.textContent =
            "Save Client";

    }
);


/* =========================================================
   LOAD CLIENTS
========================================================= */

async function loadClients(){

    const { data, error } =
        await supabaseClient
            .from("Clients")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(error);

        clientList.innerHTML = `
            <div class="empty">
                Error loading clients:<br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }


    clients =
        data || [];


    totalClients.textContent =
        clients.length;


    activeProfiles.textContent =
        clients.length;


    nfcCards.textContent =
        0;


    renderClients(clients);

}


/* =========================================================
   RENDER CLIENTS
========================================================= */

function renderClients(list){

    if(!list.length){

        clientList.innerHTML = `
            <div class="empty">
                No clients found.
            </div>
        `;

        return;
    }


    clientList.innerHTML =
        list.map(
            function(client){

                const avatar =
                    client.photo
                    ?
                    `<img
                        src="${escapeAttribute(client.photo)}"
                        alt="">`
                    :
                    "👤";


                return `

                    <div class="client">

                        <div class="client-info">

                            <div class="avatar">
                                ${avatar}
                            </div>

                            <div>

                                <div class="client-name">
                                    ${escapeHtml(
                                        client.name ||
                                        "Unnamed Client"
                                    )}
                                </div>

                                <div class="client-company">
                                    ${escapeHtml(
                                        client.company ||
                                        client.job ||
                                        "No company"
                                    )}
                                </div>

                            </div>

                        </div>


                        <div class="client-actions">

                            <span class="status">
                                Active
                            </span>


                            <button
                                class="action-btn view-btn"
                                onclick="viewClient('${client.id}')">

                                👁 View

                            </button>


                            <button
                                class="action-btn edit-btn"
                                onclick="editClient('${client.id}')">

                                ✏️ Edit

                            </button>


                            <button
                                class="action-btn delete-btn"
                                onclick="deleteClient('${client.id}')">

                                🗑 Delete

                            </button>

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* =========================================================
   VIEW CLIENT
========================================================= */

function viewClient(id){

    const url =
        window.location.origin +
        window.location.pathname.replace(
            "admin.html",
            "index.html"
        ) +
        "?id=" +
        encodeURIComponent(id);


    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   EDIT CLIENT
========================================================= */

function editClient(id){

    const client =
        clients.find(
            function(item){
                return String(item.id) === String(id);
            }
        );


    if(!client){

        alert("Client not found.");

        return;
    }


    editingClientId =
        id;


    modalTitle.textContent =
        "Edit Client";


    saveClientButton.textContent =
        "Update Client";


    clientForm.elements["name"].value =
        client.name || "";


    clientForm.elements["job"].value =
        client.job || "";


    clientForm.elements["company"].value =
        client.company || "";


    clientForm.elements["phone"].value =
        client.phone || "";


    clientForm.elements["whatsapp"].value =
        client.whatsapp || "";


    clientForm.elements["email"].value =
        client.email || "";


    clientForm.elements["website"].value =
        client.website || "";


    clientForm.elements["instagram"].value =
        client.instagram || "";


    clientForm.elements["facebook"].value =
        client.facebook || "";


    clientForm.elements["linkedin"].value =
        client.linkedin || "";


    clientForm.elements["photo"].value =
        client.photo || "";


    clientForm.elements["cover"].value =
        client.cover || "";


    clientForm.elements["about"].value =
        client.about || "";


    hideMessage();


    clientModal.style.display =
        "flex";

}


/* =========================================================
   DELETE CLIENT
========================================================= */

async function deleteClient(id){

    const client =
        clients.find(
            function(item){
                return String(item.id) === String(id);
            }
        );


    if(!client){

        alert("Client not found.");

        return;
    }


    const confirmed =
        confirm(
            "Delete " +
            (client.name || "this client") +
            "?"
        );


    if(!confirmed){

        return;
    }


    const { error } =
        await supabaseClient
            .from("Clients")
            .delete()
            .eq("id", id);


    if(error){

        alert(
            "Error deleting client: " +
            error.message
        );

        return;
    }


    await loadClients();

}


/* =========================================================
   SEARCH
========================================================= */

searchClient.addEventListener(
    "input",
    function(){

        const query =
            searchClient.value
                .toLowerCase()
                .trim();


        if(!query){

            renderClients(clients);

            return;
        }


        const filtered =
            clients.filter(
                function(client){

                    return (

                        String(
                            client.name || ""
                        )
                        .toLowerCase()
                        .includes(query)

                        ||

                        String(
                            client.company || ""
                        )
                        .toLowerCase()
                        .includes(query)

                        ||

                        String(
                            client.email || ""
                        )
                        .toLowerCase()
                        .includes(query)

                        ||

                        String(
                            client.phone || ""
                        )
                        .toLowerCase()
                        .includes(query)

                    );

                }
            );


        renderClients(filtered);

    }
);


/* =========================================================
   MESSAGES
========================================================= */

function showMessage(message,type){

    formMessage.textContent =
        message;

    formMessage.className =
        "form-message " +
        type;

}


function hideMessage(){

    formMessage.textContent =
        "";

    formMessage.className =
        "form-message";

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttribute(value){

    return escapeHtml(value);

}

checkSession();
